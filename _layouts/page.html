---
layout: default
---
<div class="container inner-page">
  <div class="page-intro">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="intro-text">{{ page.subtitle }}</p>{% endif %}
  </div>
  <div class="page-content prose">{{ content }}</div>
</div>
