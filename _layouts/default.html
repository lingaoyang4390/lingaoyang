<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  {% include head.html %}
  <body>
    <div class="site-shell">
      {% include header.html %}
      <main id="main-content">{{ content }}</main>
      {% include footer.html %}
    </div>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    {% if page.search_page %}
      <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
