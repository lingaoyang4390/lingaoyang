<article class="post-card">
  <div class="card-meta">
    <a class="category-pill" href="{{ '/categories/' | relative_url }}">{{ include.post.categories | first | default: '随笔' }}</a>
    <time datetime="{{ include.post.date | date: '%Y-%m-%d' }}">{{ include.post.date | date: '%Y.%m.%d' }}</time>
  </div>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  <p>{{ include.post.description | default: include.post.excerpt | strip_html | normalize_whitespace | truncate: 105 }}</p>
  <a class="read-more" href="{{ include.post.url | relative_url }}" aria-label="阅读：{{ include.post.title | escape }}">阅读全文 <span aria-hidden="true">↗</span></a>
</article>
